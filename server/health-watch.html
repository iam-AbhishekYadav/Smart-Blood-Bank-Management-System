<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Health Watch</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #050805; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Share Tech Mono', monospace; }
    .watch-shell { background: #0a0e0a; border: 1.5px solid #1a2e1a; border-radius: 20px; padding: 2rem 2.5rem 1.75rem; width: 100%; max-width: 520px; }
    .brand-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; }
    .brand { font-family: 'Orbitron', monospace; font-size: 11px; color: #2a4a2a; letter-spacing: 4px; text-transform: uppercase; }
    .status-pill { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 11px; letter-spacing: 1px; transition: all 0.3s; border: 0.5px solid #1a3a1a; color: #555; }
    .status-pill.alive { color: #00e85a; border-color: #003a15; }
    .status-pill.dead  { color: #e83030; border-color: #3a0000; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #333; transition: all 0.3s; }
    .alive .dot { background: #00e85a; box-shadow: 0 0 7px #00e85a; }
    .dead .dot  { background: #e83030; }
    .lcd-display { background: #050d05; border: 1px solid #0e1e0e; border-radius: 10px; padding: 1.5rem 1rem 1.25rem; text-align: center; position: relative; overflow: hidden; }
    .lcd-display::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,60,0.012) 2px, rgba(0,255,60,0.012) 4px); pointer-events: none; }
    .ghost { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    .ghost-main { font-size: 58px; letter-spacing: 4px; color: #001a08; line-height: 1; }
    .ghost-ms   { font-size: 26px; letter-spacing: 3px; color: #001208; margin-top: 4px; }
    .time-main { font-size: 58px; letter-spacing: 4px; color: #00e85a; line-height: 1; text-shadow: 0 0 18px rgba(0,232,90,0.45); position: relative; z-index: 1; }
    .time-ms   { font-size: 26px; color: #009938; letter-spacing: 3px; margin-top: 4px; position: relative; z-index: 1; }
    .date-row  { margin-top: 10px; font-size: 12px; color: #1e5a2e; letter-spacing: 3px; position: relative; z-index: 1; }
    .divider   { width: 60px; height: 0.5px; background: #0e2e0e; margin: 1.25rem auto; }
    .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .metric { background: #060d06; border: 0.5px solid #0e1e0e; border-radius: 8px; padding: 8px 6px; text-align: center; }
    .metric-label { font-size: 9px; color: #1e4a2a; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
    .metric-val { font-size: 13px; color: #00c048; letter-spacing: 1px; }
    .metric-val.warn   { color: #e87000; }
    .metric-val.danger { color: #e83030; }
    .url-row { margin-top: 1.5rem; display: flex; gap: 8px; }
    .url-row input { flex: 1; background: #060d06; border: 0.5px solid #1a3a1a; border-radius: 8px; color: #00c048; font-family: 'Share Tech Mono', monospace; font-size: 12px; padding: 8px 10px; outline: none; letter-spacing: 0.5px; transition: border-color 0.2s; }
    .url-row input:focus { border-color: #00e85a; }
    .ping-btn { background: transparent; border: 0.5px solid #1a4a1a; border-radius: 8px; color: #00e85a; font-family: 'Share Tech Mono', monospace; font-size: 11px; padding: 8px 16px; cursor: pointer; letter-spacing: 1px; white-space: nowrap; transition: background 0.2s; }
    .ping-btn:hover { background: #0a1e0a; }
    .ping-btn.stop { color: #e83030; border-color: #3a1a1a; }
    .ping-btn.stop:hover { background: #1e0a0a; }
    .log-strip { margin-top: 10px; border: 0.5px solid #0e1e0e; border-radius: 8px; padding: 8px 10px; height: 70px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; justify-content: flex-end; }
    .log-line     { font-size: 10px; color: #1e5a2a; letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-line.ok  { color: #00a038; }
    .log-line.err { color: #a03030; }
    .footer-row { display: flex; justify-content: space-between; margin-top: 1.25rem; font-size: 10px; color: #153a1a; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="watch-shell">
    <div class="brand-row">
      <span class="brand">Render Watch</span>
      <span class="status-pill" id="status-pill">
        <span class="dot"></span>
        <span id="status-text">IDLE</span>
      </span>
    </div>
    <div class="lcd-display">
      <div class="ghost" aria-hidden="true">
        <div class="ghost-main">88:88:88</div>
        <div class="ghost-ms">.888</div>
      </div>
      <div class="time-main" id="time-main">00:00:00</div>
      <div class="time-ms"   id="time-ms">.000</div>
      <div class="date-row"  id="date-row">MON 01 JAN 2026</div>
    </div>
    <div class="divider"></div>
    <div class="metrics-grid">
      <div class="metric"><div class="metric-label">Monitor</div><div class="metric-val" id="m-uptime">--:--</div></div>
      <div class="metric"><div class="metric-label">Srv uptime</div><div class="metric-val" id="m-srv-uptime">---s</div></div>
      <div class="metric"><div class="metric-label">Latency</div><div class="metric-val" id="m-latency">--- ms</div></div>
      <div class="metric"><div class="metric-label">Checks</div><div class="metric-val" id="m-checks">0</div></div>
    </div>
    <div class="url-row">
      <input id="url-input" type="text" value="https://smart-blood-bank-management-system.onrender.com/api/health" spellcheck="false" />
      <button class="ping-btn" id="toggle-btn">START</button>
    </div>
    <div class="log-strip" id="log-strip"></div>
    <div class="footer-row">
      <span>HEALTH MONITOR v1.0</span>
      <span>INTERVAL: 5s</span>
    </div>
  </div>

  <script src="watch.js"></script>
</body>
</html>
